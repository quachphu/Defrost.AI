services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: defrosted
      POSTGRES_PASSWORD: defrosted
      POSTGRES_DB: defrosted
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U defrosted"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://defrosted:defrosted@postgres:5432/defrosted
      JWT_SECRET_KEY: defrost-ai-jwt-secret-do-not-share
      GROQ_API_KEY: ${GROQ_API_KEY}
      RENTCAST_API_KEY: ${RENTCAST_API_KEY:-}
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
