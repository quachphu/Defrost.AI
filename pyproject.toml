[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defrosted"
version = "0.1.0"
description = "Defrosted.ai — an AI agent that finds, contacts, negotiates with, and closes rental leases on behalf of renters."
requires-python = ">=3.12"
readme = "README.md"

# Production stack from the engineering spec (§2). Heavy integration packages
# (temporal, playwright, langgraph, elasticsearch) are real runtime deps but are
# only exercised when their modules are imported — see the `infra` extra for the
# pieces you only need when running the full system rather than the unit suite.
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "sendgrid>=6.11",
    "twilio>=9.0",
    "boto3>=1.34",
    "python-jose[cryptography]>=3.3",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The heavyweight runtime services. Kept separate so the domain/repository/agent
# unit suite can run without booting the whole infrastructure stack.
infra = [
    "temporalio>=1.6",
    "langgraph>=0.2",
    "groq>=0.11",
    "playwright>=1.45",
    "elasticsearch>=8.14",
    "pgvector>=0.3",
    "alembic>=1.13",
    "sentry-sdk>=2.10",
    "langsmith>=0.1",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "factory_boy>=3.3",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/defrosted"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # long lines (SQL/prompts) are fine
    "B008",   # FastAPI's Depends(...) in defaults is idiomatic, not a bug
    "UP042",  # the spec deliberately uses (str, Enum), not StrEnum
    "UP046",  # the spec deliberately uses Generic[T], not PEP 695 type params
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally reach into private methods and use mock plumbing.
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
