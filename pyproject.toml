[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defrosted"
version = "0.1.0"
description = "Defrost.AI — your personal AI real estate agent: rent-vs-buy analysis, live listings, and agent-to-agent deals with no commission."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.7",
    "asyncpg>=0.29",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Runtime services used by the deployed app (installed in the Docker image).
infra = [
    "groq>=0.11",
    "uvicorn[standard]>=0.30",
    "ddgs>=9.0",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/defrosted"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # long lines (SQL/prompts) are fine
    "B008",   # FastAPI's Depends(...) in defaults is idiomatic, not a bug
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
